
services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: adelante_sumerce_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: adelante_sumerce
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./adelante_sumerce/sources/create_database.sql:/docker-entrypoint-initdb.d/01_create_database.sql
      - ./adelante_sumerce/sources/data.sql:/docker-entrypoint-initdb.d/02_data.sql
      - ./auth_service/migrations/001_add_refresh_tokens.sql:/docker-entrypoint-initdb.d/03_refresh_tokens.sql
    networks:
      - adelante_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: adelante_sumerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - adelante_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Zookeeper (requerido por Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: adelante_sumerce_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - adelante_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: adelante_sumerce_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - adelante_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9093"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Auth Service (Microservicio de Autenticación)
  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: adelante_sumerce_auth
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: dbuser
      DB_PASSWORD: dbpassword
      DB_NAME: adelante_sumerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key-change-in-production}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost,http://localhost:80,http://nginx
    ports:
      - "3001:3001"
    networks:
      - adelante_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Report Service (Microservicio de Reportes)
  report_service:
    build:
      context: ./report_service
      dockerfile: Dockerfile
    container_name: adelante_sumerce_reports
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9093
      KAFKA_CLIENT_ID: report-service
      KAFKA_GROUP_ID: report-service-group
      TOPIC_GENERATE_USER_REPORT: generate-user-report
      TOPIC_GENERATE_ADMIN_REPORT: generate-admin-report
      TOPIC_GENERATE_COMPARATIVE_REPORT: generate-comparative-report
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@adelantesumerce.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO}
    volumes:
      - report_logs:/app/logs
    networks:
      - adelante_network
    restart: unless-stopped

  # Main Application - Replica 1
  app_1:
    build:
      context: ./adelante_sumerce
      dockerfile: Dockerfile
    container_name: adelante_sumerce_app_1
    volumes:
    - ./adelante_sumerce:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3030
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: dbuser
      DB_PASSWORD: dbpassword
      DB_NAME: adelante_sumerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9093
      TOPIC_GENERATE_USER_REPORT: generate-user-report
      TOPIC_GENERATE_ADMIN_REPORT: generate-admin-report
      TOPIC_GENERATE_COMPARATIVE_REPORT: generate-comparative-report
      AUTH_SERVICE_URL: http://auth_service:3001/api/auth
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - adelante_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3030/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Main Application - Replica 2
  app_2:
    build:
      context: ./adelante_sumerce
      dockerfile: Dockerfile
    container_name: adelante_sumerce_app_2
    volumes:
    - ./adelante_sumerce:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3030
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: dbuser
      DB_PASSWORD: dbpassword
      DB_NAME: adelante_sumerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9093
      TOPIC_GENERATE_USER_REPORT: generate-user-report
      TOPIC_GENERATE_ADMIN_REPORT: generate-admin-report
      TOPIC_GENERATE_COMPARATIVE_REPORT: generate-comparative-report
      TOPIC_CHARACTERIZATION_WRITES: characterization-writes
      TOPIC_CHARACTERIZATION_UPDATES: characterization-updates
      AUTH_SERVICE_URL: http://auth_service:3001/api/auth
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - adelante_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3030/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Main Application - Replica 3
  app_3:
    build:
      context: ./adelante_sumerce
      dockerfile: Dockerfile
    container_name: adelante_sumerce_app_3
    volumes:
    - ./adelante_sumerce:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3030
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: dbuser
      DB_PASSWORD: dbpassword
      DB_NAME: adelante_sumerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9093
      TOPIC_GENERATE_USER_REPORT: generate-user-report
      TOPIC_GENERATE_ADMIN_REPORT: generate-admin-report
      TOPIC_GENERATE_COMPARATIVE_REPORT: generate-comparative-report
      AUTH_SERVICE_URL: http://auth_service:3001/api/auth
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - adelante_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3030/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: adelante_sumerce_nginx
    depends_on:
      app_1:
        condition: service_healthy
      app_2:
        condition: service_healthy
      app_3:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - adelante_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  adelante_network:
    driver: bridge
    name: adelante_sumerce_network

volumes:
  mysql_data:
    name: adelante_sumerce_mysql_data
  redis_data:
    name: adelante_sumerce_redis_data
  zookeeper_data:
    name: adelante_sumerce_zookeeper_data
  zookeeper_logs:
    name: adelante_sumerce_zookeeper_logs
  kafka_data:
    name: adelante_sumerce_kafka_data
  report_logs:
    name: adelante_sumerce_report_logs
